name: strivepay-staging

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./secrets/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strivepay -d strivepay_consumer"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  api:
    image: strivepay-api:staging
    restart: unless-stopped
    env_file: ./secrets/api.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:18080/actuator/health"]
      interval: 20s
      timeout: 8s
      retries: 12
      start_period: 60s
    mem_limit: 640m

  worker:
    image: strivepay-worker:staging
    restart: unless-stopped
    env_file: ./secrets/worker.env
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m

  consumer-web:
    image: strivepay-consumer-web:staging
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "18081"
      CONSUMER_API_URL: https://api.staging.strivepay.io
      NEXT_PUBLIC_APP_URL: https://staging.strivepay.io
    mem_limit: 192m

  admin-web:
    image: strivepay-admin-web:staging
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      PORT: "18082"
      ADMIN_API_URL: https://api.staging.strivepay.io
      NEXT_PUBLIC_APP_URL: https://cockpit.staging.strivepay.io
    mem_limit: 192m

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      consumer-web:
        condition: service_started
      admin-web:
        condition: service_started
    mem_limit: 128m

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

